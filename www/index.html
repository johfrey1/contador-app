<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1C45">
<title>Contador de asistentes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contador">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<style>
:root{
  --bg:#0E1C45; --card:#1A2F66; --card-2:#152859; --line:#2B4488; --ink:#FFFFFF; --muted:#AEB9D6;
  --nav:#141C38; --nav-line:#2A3558; --active:#23346E; --accent:#4F7BFF;
  --h:#3F72FF; --m:#F0457A; --j:#F59E0B; --ok:#22C38E;
  --glow-home:rgba(63,114,255,.55); --glow-saved:rgba(20,150,120,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#EEF2FB; --card:#FFFFFF; --card-2:#F4F7FD; --line:#D5DDF0; --ink:#0E1C45; --muted:#56637F;
  --nav:#FFFFFF; --nav-line:#D5DDF0; --active:#E3EAFB; --accent:#2F5BE0;
  --glow-home:rgba(63,114,255,.25); --glow-saved:rgba(20,150,120,.25);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden}
.glow{position:fixed;inset:0 0 auto 0;height:55vh;pointer-events:none;z-index:0;
  background:radial-gradient(120% 90% at 100% 0%,var(--g,var(--glow-home)) 0%,transparent 60%);transition:background .4s}
.view{position:relative;z-index:1;height:100%;overflow-y:auto;padding:18px 18px 130px;max-width:560px;margin:0 auto;display:none}
.view.on{display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 18px}
.brand{background:linear-gradient(160deg,#2A4FC9,#0F2A8A);border:2px solid #7C9BFF;border-radius:10px;
  padding:8px 16px;color:#fff;font-weight:900;font-size:1.15rem;letter-spacing:.02em;box-shadow:0 4px 18px rgba(20,50,160,.45)}
.circle{width:58px;height:58px;border-radius:50%;background:var(--card-2);border:1.5px solid var(--line);
  display:grid;place-items:center}
.circle svg{width:26px;height:26px}
.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem;margin:-6px 4px 14px;min-height:22px}
.status .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);transition:opacity .2s}
.status.saving .dot{background:var(--j)}

/* total */
.totalCard{background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:16px 22px;
  display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.totalCard .t-l{font-weight:700;font-size:1.05rem}
.totalCard .t-l span{display:block;color:var(--muted);font-weight:500;font-size:.9rem;margin-top:2px}
.totalCard .t-n{font-size:2.6rem;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}

/* pads */
.pads{flex:1;display:flex;flex-direction:column;gap:12px;min-height:390px}
.pad{flex:1;min-height:118px;border-radius:32px;background:var(--card);border:1.5px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:0 22px;text-align:left;position:relative;overflow:hidden;
  transition:transform .08s ease}
.pad:active{transform:scale(.98)}
.pad::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c)}
.av{width:62px;height:62px;border-radius:50%;background:var(--c);display:grid;place-items:center;
  font-weight:900;font-size:1.5rem;color:#fff;flex:none;box-shadow:0 6px 18px color-mix(in srgb,var(--c) 45%,transparent)}
.pad .name{flex:1;font-size:1.45rem;font-weight:700}
.pad .name span{display:block;font-size:.88rem;font-weight:500;color:var(--muted);margin-top:3px}
.pad .num{font-size:3.4rem;font-weight:900;font-variant-numeric:tabular-nums}
.pad.h{--c:var(--h)} .pad.m{--c:var(--m)} .pad.j{--c:var(--j)}
.pad .fx{position:absolute;inset:0;background:var(--c);opacity:0;pointer-events:none}
.pad.hit .fx{animation:fx .3s ease-out}
@keyframes fx{from{opacity:.35}to{opacity:0}}

/* guardados */
.savedHead{display:flex;align-items:flex-start;justify-content:space-between;margin:40px 0 26px}
.title{font-size:2.5rem;font-weight:900;margin:0;letter-spacing:-.01em}
.ribbon{width:58px;height:86px;background:var(--j);clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);border-radius:8px 8px 0 0;margin-top:-16px}
.section{color:var(--muted);font-weight:700;font-size:.9rem;letter-spacing:.12em;margin:8px 8px 12px}
.row{background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:16px 18px;display:flex;
  align-items:center;gap:14px;margin-bottom:12px}
.row .ic{width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;flex:none;font-weight:900;font-size:1.25rem}
.row .info{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mt{color:var(--muted);font-size:.88rem;margin-top:4px;font-variant-numeric:tabular-nums}
.row .chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:.8rem;font-weight:700;padding:4px 9px;border-radius:999px;color:#fff}
.row .del{border:0;background:none;color:var(--muted);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.row .del svg{width:22px;height:22px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  color:var(--muted);font-size:1.15rem;line-height:1.5;padding:40px 24px}
.empty svg{width:44px;height:44px;margin-bottom:18px;color:var(--muted)}

.export{margin:6px 0 0;min-height:56px;border-radius:20px;border:1.5px solid var(--line);background:var(--card-2);font-weight:700;font-size:1.02rem}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  width:calc(100% - 28px);max-width:540px;height:84px;background:var(--nav);border:1.5px solid var(--nav-line);
  border-radius:44px;display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr 1fr;align-items:center;z-index:5}
.nav .it{border:0;background:none;display:grid;place-items:center;height:64px;width:64px;margin:auto;border-radius:50%;color:var(--muted)}
.nav .it svg{width:30px;height:30px}
.nav .it.on{background:var(--active);color:var(--accent)}
.nav .it:disabled{opacity:.35}
.fab{justify-self:center;width:76px;height:76px;border-radius:50%;margin-top:-54px;border:3px solid #fff;
  background:radial-gradient(circle at 30% 25%,#3D7BFF,#0B2FB5 60%,#061A6E);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(10,40,170,.55)}
.fab svg{width:34px;height:34px}
.fab:disabled{opacity:.6}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(3,8,25,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--card);border:1.5px solid var(--line);border-bottom:0;width:100%;max-width:560px;border-radius:32px 32px 0 0;
  padding:24px 20px calc(22px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 6px;font-size:1.5rem;font-weight:800}
.panel p{margin:0 0 16px;color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.sum div{border-radius:20px;padding:12px 6px;text-align:center;color:#fff;font-weight:600;font-size:.9rem}
.sum b{display:block;font-size:1.8rem;font-weight:900}
.field{width:100%;font:inherit;font-size:1.1rem;padding:16px;border-radius:20px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--ink);margin-bottom:16px}
.acts{display:flex;gap:10px}
.btn{flex:1;min-height:58px;border-radius:20px;border:1.5px solid var(--line);background:var(--card-2);font-weight:700;font-size:1.05rem}
.btn.primary{background:linear-gradient(160deg,#3D7BFF,#0B2FB5);border-color:transparent;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));
  background:var(--ok);color:#fff;font-weight:700;padding:12px 20px;border-radius:16px;opacity:0;transition:opacity .2s;z-index:20;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.pad,.glow,.toast{transition:none}.pad.hit .fx{animation:none}}
</style>
</head>
<body>
<div class="glow" id="glow"></div>

<!-- INICIO -->
<main class="view on" id="v-home">
  <div class="head">
    <div class="brand">Contador</div>
    <button class="circle" id="theme" aria-label="Cambiar tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <div class="status" id="status"><i class="dot"></i><span id="statusTxt">Guardado automático activo</span></div>

  <div class="totalCard">
    <div class="t-l">Total asistentes<span id="started">Conteo nuevo</span></div>
    <div class="t-n" id="tot" aria-live="polite">0</div>
  </div>

  <div class="pads">
    <button class="pad h" data-k="h" aria-label="Sumar hombre"><i class="fx"></i><div class="av">H</div><div class="name">Hombres<span>Toca para sumar</span></div><div class="num" id="n-h">0</div></button>
    <button class="pad m" data-k="m" aria-label="Sumar mujer"><i class="fx"></i><div class="av">M</div><div class="name">Mujeres<span>Toca para sumar</span></div><div class="num" id="n-m">0</div></button>
    <button class="pad j" data-k="j" aria-label="Sumar joven"><i class="fx"></i><div class="av">J</div><div class="name">Jóvenes<span>Toca para sumar</span></div><div class="num" id="n-j">0</div></button>
  </div>
</main>

<!-- GUARDADOS -->
<main class="view" id="v-saved">
  <div class="savedHead"><h1 class="title">Guardados</h1><div class="ribbon" aria-hidden="true"></div></div>
  <div id="list" style="display:flex;flex-direction:column;flex:1"></div>
  <button class="export" id="export">Enviar respaldo (WhatsApp, Drive…)</button>
</main>

<!-- NAV -->
<nav class="nav">
  <button class="it on" id="tab-home" aria-label="Inicio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
  </button>
  <button class="it" id="tab-saved" aria-label="Guardados">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
  </button>
  <button class="fab" id="fab" aria-label="Cerrar conteo y empezar otro">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg>
  </button>
  <button class="it" id="undo" aria-label="Deshacer último toque">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>
  <button class="it" id="reset" aria-label="Poner en cero">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
</nav>

<!-- Cerrar conteo -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <div class="panel">
    <h2 id="sh-t">Cerrar conteo</h2>
    <p>Queda en Guardados y el contador vuelve a cero.</p>
    <div class="sum" id="sum"></div>
    <input class="field" id="name" placeholder="Nombre del evento (opcional)" maxlength="60">
    <div class="acts">
      <button class="btn" id="cancel">Cancelar</button>
      <button class="btn primary" id="confirm">Cerrar y guardar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(async function(){
  const $ = id => document.getElementById(id);
  const Cap = window.Capacitor && window.Capacitor.Plugins || {};
  const Prefs = Cap.Preferences, Share = Cap.Share, App = Cap.App;

  // Almacenamiento nativo del celular (SharedPreferences). En navegador usa localStorage.
  const store = {
    async get(k,d){ try{
      if(Prefs){ const r=await Prefs.get({key:k}); return r&&r.value?JSON.parse(r.value):d; }
      const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
    set(k,v){ try{
      const s=JSON.stringify(v);
      if(Prefs) return Prefs.set({key:k,value:s}).catch(()=>{});
      localStorage.setItem(k,s); }catch(e){} }
  };

  const KEY_CUR="contador:actual", KEY_HIST="contador:historial", KEY_THEME="contador:tema";
  const blank=()=>({h:0,m:0,j:0,taps:[],inicio:null,updatedAt:0});
  const fmt=ms=>{try{return new Date(ms).toLocaleString("es-CO",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}catch(e){return ""}};
  const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

  let theme = await store.get(KEY_THEME,"dark");
  let cur = await store.get(KEY_CUR,null); if(!cur||typeof cur!=="object") cur=blank();
  cur.taps = Array.isArray(cur.taps)?cur.taps.slice(-500):[];
  let hist = await store.get(KEY_HIST,[]); if(!Array.isArray(hist)) hist=[];

  const applyTheme=()=>{ theme==="light"?document.documentElement.setAttribute("data-theme","light"):document.documentElement.removeAttribute("data-theme"); };
  applyTheme();
  $("theme").addEventListener("click",()=>{ theme=theme==="light"?"dark":"light"; store.set(KEY_THEME,theme); applyTheme(); });

  const total=()=>cur.h+cur.m+cur.j;
  function render(){
    $("n-h").textContent=cur.h; $("n-m").textContent=cur.m; $("n-j").textContent=cur.j;
    $("tot").textContent=total();
    $("started").textContent=cur.inicio?"Desde "+fmt(cur.inicio):"Conteo nuevo";
    $("undo").disabled=cur.taps.length===0; $("reset").disabled=total()===0; $("fab").disabled=total()===0;
  }
  function autosave(){
    cur.updatedAt=Date.now(); store.set(KEY_CUR,cur); render();
    $("statusTxt").textContent="Guardado en el celular · "+new Date().toLocaleTimeString("es-CO",{hour:"numeric",minute:"2-digit"});
  }

  document.querySelectorAll(".pad").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.k; if(!cur.inicio) cur.inicio=Date.now();
    cur[k]++; cur.taps.push(k); if(cur.taps.length>500) cur.taps.shift();
    autosave(); buzz(25); b.classList.remove("hit"); void b.offsetWidth; b.classList.add("hit");
  }));
  $("undo").addEventListener("click",()=>{ const k=cur.taps.pop(); if(k&&cur[k]>0) cur[k]--; autosave(); buzz([15,40,15]); });
  $("reset").addEventListener("click",()=>{ if(confirm("¿Poner el contador en cero sin guardarlo?")){ cur=blank(); autosave(); } });

  // Guardados
  function renderList(){
    const box=$("list"); box.textContent="";
    $("export").style.display=hist.length?"block":"none";
    if(!hist.length){
      box.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Aún no has cerrado conteos. Toca el botón azul del centro para guardar uno.</div>';
      return;
    }
    const sec=document.createElement("div"); sec.className="section"; sec.textContent="CONTEOS"; box.appendChild(sec);
    hist.forEach(it=>{
      const r=document.createElement("div"); r.className="row";
      const ic=document.createElement("div"); ic.className="ic"; ic.textContent=it.total;
      const info=document.createElement("div"); info.className="info";
      const nm=document.createElement("div"); nm.className="nm"; nm.textContent=it.nombre||"Sin nombre";
      const mt=document.createElement("div"); mt.className="mt"; mt.textContent=fmt(it.fecha);
      const ch=document.createElement("div"); ch.className="chips";
      [["H",it.hombres,"var(--h)"],["M",it.mujeres,"var(--m)"],["J",it.jovenes,"var(--j)"]].forEach(([l,v,c])=>{
        const sp=document.createElement("span"); sp.className="chip"; sp.style.background=c; sp.textContent=l+" "+v; ch.appendChild(sp); });
      info.append(nm,mt,ch);
      const d=document.createElement("button"); d.className="del"; d.setAttribute("aria-label","Borrar conteo");
      d.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
      d.addEventListener("click",()=>{ if(confirm(`¿Borrar "${it.nombre||"Sin nombre"}"?`)){ hist=hist.filter(x=>x.id!==it.id); store.set(KEY_HIST,hist); renderList(); } });
      r.append(ic,info,d); box.appendChild(r);
    });
  }

  // Respaldo en CSV
  $("export").addEventListener("click",async()=>{
    const rows=[["Evento","Fecha","Hombres","Mujeres","Jovenes","Total"]]
      .concat(hist.map(x=>[(x.nombre||"Sin nombre").replace(/[;\n]/g," "),new Date(x.fecha).toLocaleString("es-CO"),x.hombres,x.mujeres,x.jovenes,x.total]));
    const csv=rows.map(r=>r.join(";")).join("\n");
    try{
      if(Share) await Share.share({title:"Respaldo de conteos",text:csv,dialogTitle:"Enviar respaldo"});
      else if(navigator.share) await navigator.share({title:"Respaldo de conteos",text:csv});
      else alert(csv);
    }catch(e){}
  });

  // Vistas
  let view="home";
  function show(v){
    view=v;
    $("v-home").classList.toggle("on",v==="home"); $("v-saved").classList.toggle("on",v==="saved");
    $("tab-home").classList.toggle("on",v==="home"); $("tab-saved").classList.toggle("on",v==="saved");
    $("glow").style.setProperty("--g",v==="home"?"var(--glow-home)":"var(--glow-saved)");
    if(v==="saved") renderList();
  }
  $("tab-home").addEventListener("click",()=>show("home"));
  $("tab-saved").addEventListener("click",()=>show("saved"));

  // Cerrar conteo
  const sheet=$("sheet");
  $("fab").addEventListener("click",()=>{
    const s=$("sum"); s.textContent="";
    [["Hombres",cur.h,"var(--h)"],["Mujeres",cur.m,"var(--m)"],["Jóvenes",cur.j,"var(--j)"]].forEach(([l,v,c])=>{
      const d=document.createElement("div"); d.style.background=c; const b=document.createElement("b"); b.textContent=v; d.append(b,document.createTextNode(l)); s.appendChild(d); });
    $("name").value=""; sheet.classList.add("open");
  });
  $("cancel").addEventListener("click",()=>sheet.classList.remove("open"));
  sheet.addEventListener("click",e=>{ if(e.target===sheet) sheet.classList.remove("open"); });
  $("confirm").addEventListener("click",()=>{
    hist.unshift({id:String(Date.now()),nombre:$("name").value.trim().slice(0,60),hombres:cur.h,mujeres:cur.m,jovenes:cur.j,total:total(),fecha:Date.now(),inicio:cur.inicio||null});
    hist=hist.slice(0,500); store.set(KEY_HIST,hist);
    cur=blank(); autosave(); sheet.classList.remove("open");
    const t=$("toast"); t.textContent="Conteo guardado"; t.classList.add("show"); buzz(60); setTimeout(()=>t.classList.remove("show"),1600);
  });

  // Botón atrás de Android
  if(App) App.addListener("backButton",()=>{
    if(sheet.classList.contains("open")) sheet.classList.remove("open");
    else if(view!=="home") show("home");
    else App.minimizeApp();
  });


  // PWA (iPhone / navegador): funciona sin internet y pide que no se borren los datos
  const native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if(!native){
    if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
    try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  }
  render();
  $("statusTxt").textContent="Guardado automático en el celular";
})();
</script>

</body>
</html>
